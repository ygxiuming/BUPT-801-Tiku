# 自建服务器部署（打包版本 + nginx）
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   # 站点：http://<服务器IP>:8080
#
# 想挂到子路径（如 http://host/tiku/）用：
#   docker compose -f deploy/docker-compose.yml build --build-arg VITE_BASE=/tiku/

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/}
    image: bupt801/web:latest
    container_name: bupt801-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
