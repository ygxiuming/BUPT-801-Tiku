# 北邮801真题库 · 静态站点配置
# 用法：把 app/dist（或 Release 里的 bupt801-web-*.zip）放到 /usr/share/nginx/html

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 日志里带上命中文件，便于排查 SPA 回退是否生效
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- SPA 回退：/practice、/paper/2025 这些前端路由在磁盘上没有对应文件 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 缓存策略 ----
    # dist/assets 里的文件名带内容 hash，可以放心长缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # KaTeX 与题库数据：改版靠文件名变化，缓存一个月足够
    location ^~ /vendor/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ^~ /data/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    # 入口页不缓存，否则发新版后用户会一直拿到旧的资源清单
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /404.html   { add_header Cache-Control "no-store"; }

    # ---- 压缩（KaTeX 字体与题库 JS 体积可观，压缩收益明显）----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        image/svg+xml font/woff2 font/woff font/ttf;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---- 可选：服务端排版（在线 PDF 下载）----
    # 静态部署没有后端，试卷页会自动降级为浏览器打印。
    # 想启用在线 PDF，请起 server/（Node + Chrome），并取消下面注释：
    #
    # location ^~ /api/ {
    #     proxy_pass         http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_read_timeout 120s;   # Puppeteer 排版较慢，超时给足
    # }
}
