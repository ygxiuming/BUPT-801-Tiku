name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Google 官方的自动化发版：按 Conventional Commits 判定版本号、
      # 生成 CHANGELOG、开 Release PR；PR 合并后自动打 tag 并发布 Release
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
