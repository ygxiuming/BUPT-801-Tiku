name: Deploy to GitHub Pages

on:
  # 只在主干更新时发布；PR 只跑 CI，不发版
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 安装 server 依赖（提供 KaTeX）
        working-directory: server
        run: npm ci

      # Pages 站点带子路径，必须把资源前缀一并打进去，否则 /data、/vendor 会 404
      - name: 构建（Pages 子路径）
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # SPA 直开子路由（如 /practice）时 Pages 找不到对应文件，回退到 404.html，
      # 这里让它与 index.html 同内容，由 vue-router 接管
      - name: 生成 SPA 回退页与 .nojekyll
        working-directory: app/dist
        run: |
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 部署完自检：站点能打开、资源前缀正确、题库数据在位。
      # Pages 刚发布时 CDN 可能有几秒延迟，所以带重试。
      - name: 部署后自检
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$URL" || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "首页状态码: $code"
          [ "$code" = "200" ] || { echo "::error::站点不可达 $URL"; exit 1; }

          # 资源必须是子路径前缀，否则说明 VITE_BASE 没生效
          grep -q 'vendor/katex' /tmp/index.html || { echo "::error::index.html 缺少 KaTeX 引用"; exit 1; }

          entry=$(grep -oE '<script[^>]*type="module"[^>]*src="[^"]*"' /tmp/index.html | grep -oE 'src="[^"]*"' | head -1 | cut -d'"' -f2)
          echo "入口: $entry"
          origin=$(printf '%s' "$URL" | cut -d'/' -f1-3)
          curl -sf -o /dev/null "${origin}${entry}" || { echo "::error::入口 bundle 取不到: $entry"; exit 1; }
          curl -sf -o /dev/null "${URL}data/questions/2026/paper.js" || { echo "::error::题库数据取不到"; exit 1; }
          echo "自检通过"
