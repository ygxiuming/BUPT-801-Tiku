name: Release assets

# release-please 合并 Release PR 后会自动创建 GitHub Release，
# 这里把根路径打包好的静态站点挂成附件，方便直接下载部署（nginx / 任意静态托管）
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dist-zip:
    name: 打包静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 安装 server 依赖（提供 KaTeX）
        working-directory: server
        run: npm ci

      # 不打 VITE_BASE：这个包用于根路径部署（nginx / 自建服务器），
      # 与 Pages 那份（带子路径）分开构建
      - name: 构建
        working-directory: app
        run: npm run build

      - name: 打包
        run: |
          cd app/dist
          zip -qr "../../bupt801-web-${GITHUB_REF_NAME}.zip" .

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "bupt801-web-${GITHUB_REF_NAME}.zip" --clobber
