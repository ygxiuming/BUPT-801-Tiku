name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支上并发跑没意义，取消旧的那次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 数据校验 · 构建 · 页面实测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      # sync-data 从 server 的 node_modules 取 KaTeX（版本锁定 0.16.11），
      # 所以构建前必须先把 server 的依赖装上
      - name: 安装 server 依赖
        working-directory: server
        run: npm ci

      - name: 安装 jsdom（页面实测用，不进 lockfile）
        working-directory: app
        run: npm i --no-save jsdom

      - name: 数据校验（0 错误 0 警告）
        run: node tools/validate_data.js

      - name: 构建前端（vite，验生产构建）
        working-directory: app
        run: npm run build

      # 冒烟与审计直接跑 vite 产出的真实上线产物（与 Pages 部署同一份）。
      # 早前这里先跑 tools/build-frontend.mjs 回退构建，是因为曾误判「vite 产物在 jsdom 下
      # 会因 Transition 抛 nextSibling 错误」——真实原因是测试脚本把 type="module" 入口
      # 当经典脚本 eval 了第二遍。修掉加载器后两种产物等价，优先测真实产物。
      - name: 页面冒烟
        run: node tools/smoke_pages.mjs

      - name: 全站审计
        run: node tools/audit_site.mjs
