name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支上并发跑没意义，取消旧的那次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 数据校验 · 构建 · 页面实测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      # sync-data 从 server 的 node_modules 取 KaTeX（版本锁定 0.16.11），
      # 所以构建前必须先把 server 的依赖装上
      - name: 安装 server 依赖
        working-directory: server
        run: npm ci

      - name: 安装 jsdom（页面实测用，不进 lockfile）
        working-directory: app
        run: npm i --no-save jsdom

      - name: 数据校验（0 错误 0 警告）
        run: node tools/validate_data.js

      - name: 构建前端（vite，验生产构建）
        working-directory: app
        run: npm run build

      # 冒烟与审计改跑 esbuild 回退构建的产物。
      # 原因：jsdom 没有真实布局，vite 产物里 Vue 的 Transition 路径会在 patch 阶段
      # 抛 "nextSibling of null"（堆栈落在 Vue runtime 的 nextSibling），与站点本身无关；
      # 两者源码同一份，逻辑等价。线上页面另由 pages.yml 的部署后自检兜底。
      - name: 回退构建（供 jsdom 实测）
        run: node tools/build-frontend.mjs

      - name: 页面冒烟
        run: node tools/smoke_pages.mjs

      - name: 全站审计
        run: node tools/audit_site.mjs
